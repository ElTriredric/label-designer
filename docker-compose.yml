services:
  vc500w-label-app:
    image: ${LABEL_DESIGNER_IMAGE:-label-designer:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brother_color_label_app
    restart: unless-stopped
    # Bridge networking works on Docker Desktop and Linux. Manual printer IP
    # connections work; mDNS discovery may require host networking on Linux.
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
